name = "jerebu-alerts"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every 15 minutes. DOE publishes hourly; WAQI picks readings up at different times.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "jerebu"
database_id = "6c3efa8e-931b-47a3-914d-c70594f135e9"
migrations_dir = "migrations"

[observability]
enabled = true
